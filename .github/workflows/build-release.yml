# Builds the release and publishes to Maven Central
name: Build release

on:
  release:
    types: [ published ]

jobs:
  extract_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

  build:
    needs: extract_version
    uses: xemantic/.github/.github/workflows/build-gradle.yml@main
    secrets: inherit
    with:
      gradle_args: -Pversion=${{ needs.extract_version.outputs.version }} build publishToMavenCentral jreleaserAnnounce --no-configuration-cache
      maven_central: true
      jreleaser: true

  # Not covered by the reusable build-gradle workflow: this project rewrites the version in
  # README.md and gradle.properties after each release, and commits it back to the branch
  # the tag was cut from.
  update_versions:
    needs: [ extract_version, build ]
    runs-on: ubuntu-latest
    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Get target branch for tag
        run: |
          git fetch --all
          TARGET_BRANCH=$(git branch -r --contains $GITHUB_REF | grep -v "HEAD" | head -n 1 | sed 's/origin\///')
          echo "Target branch for tag: $TARGET_BRANCH"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> $GITHUB_ENV

      - name: Checkout target branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: ${{ vars.DEFAULT_JAVA_DISTRIBUTION }}
          java-version: ${{ vars.DEFAULT_JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Update versions after release
        run: ./gradlew -Pversion=${{ needs.extract_version.outputs.version }} updateVersionsAfterRelease

      - name: Commit version updates after release
        uses: stefanzweifel/git-auto-commit-action@v7.0.0
        with:
          commit_message: Version updated to ${{ needs.extract_version.outputs.version }} in README.md, next snapshot in gradle.properties
          file_pattern: 'README.md gradle.properties'
